<style>
/* ══════════════════ QAFCO · The Visit ══════════════════
   Night Shift's language, pushed. Same void, same teal, same sodium, same two
   typefaces — rebuilt around four rooms, a desk and three lenses. */
:root{
  color-scheme:dark;
  --void:#0B1214; --deep:#070C0D; --panel:#111A1C; --panel2:#162224;
  --surf:rgba(255,255,255,.055); --surf2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.19);
  --ink:#EAF3F1; --ink2:#9DB2B0; --ink3:#7A8F8E;
  --teal:#3FC7C4; --teal-d:#15464F; --halo:rgba(63,199,196,.14);
  --sod:#F3C67C; --sod-d:rgba(243,198,124,.15);
  --land:#0D1618; --water:#08171C; --coast:rgba(63,199,196,.30);
  --road:rgba(255,255,255,.055); --fill:#102C33;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
html,body{height:100%; overflow:hidden; touch-action:manipulation;
  overscroll-behavior:none}
body{margin:0; background:var(--deep); color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer;
  text-align:left}
:focus-visible{outline:3px solid var(--teal); outline-offset:3px}
.ser{font-family:"Instrument Serif",Georgia,serif; font-weight:400}
.mono{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums}

/* ── device ── */
#stage{position:fixed; inset:0; overflow:hidden;
  background:radial-gradient(ellipse at 50% -8%, #10191B 0%, #050809 62%)}
#device{width:1366px; height:1024px; position:absolute; left:0; top:0;
  border-radius:22px; overflow:hidden; background:var(--void);
  transform:scale(var(--s,1)); transform-origin:0 0;
  box-shadow:0 0 0 1px rgba(255,255,255,.09), 0 50px 120px -30px rgba(0,0,0,.95)}
/* On the iPad the glass is the device: no frame to draw. */
@media (pointer:coarse){
  #device{border-radius:0; box-shadow:none}
  #stage{background:var(--void)}
}
.rm{position:absolute; inset:0; display:none}
.rm.on{display:block}
/* Hit-testing follows what is touchable, not what is painted. */
.rm svg{pointer-events:none}
.rm svg [data-hit]{pointer-events:auto}

/* ══════════ top strip — context and the lens, no navigation ══════════ */
.top{position:absolute; left:30px; right:30px; top:24px; height:84px; z-index:40;
  display:flex; align-items:center; gap:22px}
.mk{display:flex; flex-direction:column; gap:2px; line-height:1; flex:none;
  pointer-events:none}
.mk b{font-size:20px; font-weight:500}
.mk i{font-style:normal; font-size:11px; font-weight:700; letter-spacing:.28em;
  color:var(--ink2)}
.rname{font-family:"Instrument Serif",Georgia,serif; font-size:30px; line-height:1;
  padding-left:22px; border-left:1px solid var(--line2); pointer-events:none}
.rsub{font-size:14px; color:var(--ink3); pointer-events:none; align-self:center}

/* CORRECTION 2 — the lens rail is gone.
   Four permanent buttons spent roughly 520pt of the top strip advertising options a
   visitor gets shown by a person, not by a control. One chip carries the state; the
   options live one tap away. The recovered width goes to the room name and the
   position, which are read on every single screen. */
.rwrap{display:flex; flex-direction:column; gap:5px; min-width:0; padding-left:24px;
  border-left:1px solid var(--line2); pointer-events:none}
.rname{font-family:"Instrument Serif",Georgia,serif; font-size:34px; line-height:1;
  white-space:nowrap}
.rpos{font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink3); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis}
.lchip{margin-left:auto; flex:none; min-height:64px; display:flex; align-items:center;
  gap:12px; padding:0 20px 0 22px; border-radius:16px; background:var(--surf);
  border:1px solid var(--line2);
  transition:background .2s, border-color .2s, color .2s, transform .1s}
.lchip:active{transform:scale(.97)}
.lchip .ll{font-family:"JetBrains Mono",monospace; font-size:10.5px; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; color:var(--ink3)}
.lchip .lv{font-size:17px; font-weight:600; color:var(--ink2)}
.lchip svg{width:19px; height:19px; color:var(--ink3); margin-left:-2px}
.lchip.on{background:var(--halo); border-color:var(--teal)}
.lchip.on .ll{color:var(--teal)}
.lchip.on .lv,.lchip.on svg{color:var(--ink)}

/* the honest line — what this attribute touches in THIS room, including "nothing here".
   font-size:0 collapses the line box when the lens is off, so nothing has to animate
   its own height. */
.lline{margin:0; font-size:0; line-height:1.5; color:var(--teal); opacity:0;
  transition:opacity .32s var(--ease)}
.lline.on{margin:18px 0 0; font-size:16px; opacity:1}
.axis .lline.inl{position:absolute; right:12px; top:148px; margin:0; text-align:right}
.axis .lline.inl.on{margin:0; font-size:14px}
.desk > .lline.on{margin:0; font-size:15px; flex:none}

/* the sweep band — see MO.sweep */
#sweep{position:absolute; inset:0; z-index:55; pointer-events:none; opacity:0;
  overflow:hidden}
#sweep .swb{position:absolute; top:-4%; bottom:-4%; left:0; width:100%;
  background:linear-gradient(90deg,rgba(63,199,196,0) 36%,rgba(63,199,196,.13) 46%,
    rgba(63,199,196,.42) 50%,rgba(63,199,196,.13) 54%,rgba(63,199,196,0) 64%)}

/* ══════════ body ══════════ */
.body{position:absolute; left:30px; right:30px; top:128px; bottom:138px}
.body.bleed{left:0; right:0; top:0; bottom:116px}

/* ══════════ bottom bar — the whole navigation, in reach ══════════ */
.nav{position:absolute; left:26px; right:26px; z-index:45;
  bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:flex; align-items:stretch; gap:11px; padding:11px;
  background:rgba(12,20,22,.92); border:1px solid var(--line); border-radius:20px;
  backdrop-filter:blur(16px)}
.nb{flex:1; min-height:74px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; text-align:center; font-size:17px; font-weight:600;
  color:var(--ink2); padding:8px 10px; border-radius:14px; background:var(--surf);
  border:1px solid transparent; line-height:1.2;
  transition:background .16s, color .16s, border-color .16s, transform .1s}
.nb:active{transform:scale(.97)}
.nb.on{background:var(--teal); color:var(--void); border-color:var(--teal)}
.nb small{font-size:11.5px; font-weight:500; opacity:.72; letter-spacing:.01em}
.nb.on small{opacity:.8}
.nb svg{width:22px; height:22px}
.nbk,.nbix{flex:0 0 150px; color:var(--ink); flex-direction:row; gap:9px}
.nbk{background:none; border-color:var(--line)}
.nbix{background:var(--surf2); border-color:var(--line2)}
.nbk.hide{opacity:.3; pointer-events:none}
.nbd{flex:0 0 190px; background:var(--sod-d); border-color:rgba(243,198,124,.35);
  color:var(--sod)}
.nbd.on{background:var(--sod); color:var(--void); border-color:var(--sod)}

/* ══════════ shared furniture ══════════ */
.card{background:var(--surf); border:1px solid var(--line); border-radius:18px}
.pad{padding:28px 30px}
.h2{font-family:"Instrument Serif",Georgia,serif; font-size:40px; line-height:1.08;
  margin:0 0 12px; font-weight:400}
.h3{font-family:"Instrument Serif",Georgia,serif; font-size:28px; line-height:1.15;
  margin:0 0 10px; font-weight:400}
.lbl{font-family:"JetBrains Mono",monospace; font-size:10.5px; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; color:var(--teal); margin:0 0 12px}
.tx{font-size:17px; line-height:1.62; color:var(--ink2); margin:0 0 14px}
.tx.big{font-size:19px; line-height:1.58}
.tx:last-child{margin-bottom:0}
.sv{font-family:"Instrument Serif",Georgia,serif; font-size:54px; line-height:.95}
.sl{font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink3); margin-top:8px}
.su{font-size:.42em; color:var(--teal); margin-left:3px}

/* photography — designed for, not faked */
.ph{position:relative; border-radius:16px; overflow:hidden; background:var(--panel);
  border:1px solid var(--line); display:flex; align-items:flex-end; min-height:0}
.ph::before{content:""; position:absolute; inset:0; opacity:.5;
  background:repeating-linear-gradient(128deg,transparent 0 13px,rgba(255,255,255,.028) 13px 26px)}
.ph span{position:relative; margin:18px; font-family:"JetBrains Mono",monospace;
  font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink3);
  padding:8px 12px; border-radius:7px; background:rgba(8,14,15,.75);
  border:1px solid var(--line)}

/* ══════════ the site ══════════ */
.plan{width:100%; height:100%; display:block}
.blk rect{transition:opacity .4s var(--ease), stroke .3s}
.blk.dim{opacity:.42}
.blk.lens rect.b{stroke:var(--teal); stroke-width:2.5}
.bhalo{opacity:0; transition:opacity .5s var(--ease)}
.blk.lens .bhalo{opacity:.55}
.hero{position:absolute; left:52px; top:150px; width:400px; z-index:20;
  transition:opacity .45s var(--ease), transform .45s var(--ease)}
.hero.out{opacity:0; transform:translateX(-18px); pointer-events:none}
.hero .big{font-family:"Instrument Serif",Georgia,serif; font-size:132px; line-height:.82;
  letter-spacing:-.02em}
.hero .big span{font-size:.34em; color:var(--teal)}
.hero .lede{font-family:"Instrument Serif",Georgia,serif; font-size:32px; line-height:1.22;
  margin:18px 0 0; color:var(--ink)}
.hero .place{font-family:"JetBrains Mono",monospace; font-size:11.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink3); margin:20px 0 0}
.strip{display:flex; gap:30px; margin:26px 0 0; padding-top:22px;
  border-top:1px solid var(--line); list-style:none}
.strip li{display:flex; flex-direction:column; gap:5px}
.strip b{font-family:"Instrument Serif",Georgia,serif; font-size:30px; line-height:1}
.strip span{font-size:12.5px; color:var(--ink3)}

/* the object panel — where the graph becomes navigable */
.obj{position:absolute; right:34px; top:148px; bottom:132px; width:396px; z-index:25;
  display:flex; flex-direction:column; gap:16px;
  opacity:0; visibility:hidden; transform:translateX(22px);
  transition:opacity .34s var(--ease), transform .34s var(--ease), visibility .34s}
.obj.on{opacity:1; visibility:visible; transform:none}
.obj .ph{flex:0 0 186px}
.objc{flex:1; min-height:0; display:flex; flex-direction:column;
  background:var(--panel); border:1px solid var(--line2); border-radius:18px;
  padding:24px 26px; overflow-y:auto; -webkit-overflow-scrolling:touch}
.objr{display:flex; gap:26px; margin:14px 0 18px}
.objr .sv{font-size:40px}
.objr .sl{font-size:10px; margin-top:6px}
/* the relationships — every one of them a place you can go */
.rel{margin-top:auto; padding-top:18px; border-top:1px solid var(--line)}
.rel .lbl{margin-bottom:10px}
.relb{display:flex; align-items:center; gap:12px; width:100%; min-height:64px;
  padding:0 16px; margin-top:9px; border-radius:13px; background:var(--surf);
  border:1px solid var(--line); font-size:15.5px; color:var(--ink);
  transition:background .16s, border-color .16s, transform .1s}
.relb:active{transform:scale(.98)}
.relb i{width:8px; height:8px; border-radius:50%; background:var(--teal); flex:none}
.relb em{font-style:normal; color:var(--ink3); margin-left:auto;
  font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase}
.zoomb{position:absolute; left:52px; bottom:150px; z-index:22; min-height:64px;
  display:flex; align-items:center; gap:11px; padding:0 24px; border-radius:14px;
  background:var(--surf); border:1px solid var(--line2); font-size:16.5px;
  font-weight:600}
.lgnd{position:absolute; left:52px; bottom:150px; z-index:20; display:flex; gap:26px;
  font-size:13px; color:var(--ink3); pointer-events:none}
.lgnd span{display:flex; align-items:center; gap:9px}
.lgnd i{width:22px; height:10px; border-radius:3px; display:block}
.k-blk{background:var(--fill); border:1.5px solid var(--teal)}
.k-pipe{background:repeating-linear-gradient(90deg,var(--sod) 0 7px,transparent 7px 12px);
  height:3px!important}
.k-jet{background:#41565B}

/* ══════════ the process ══════════ */
.proc{display:flex; flex-direction:column; gap:22px; height:100%}
.flow{display:grid; grid-template-columns:repeat(8,1fr); gap:10px; flex:0 0 126px}
.stg{position:relative; display:flex; flex-direction:column; justify-content:flex-end;
  gap:9px; padding:20px 16px; border-radius:16px; background:var(--surf);
  border:1px solid var(--line); min-height:64px; overflow:hidden;
  transition:background .2s, border-color .2s, opacity .35s, transform .1s}
.stg:active{transform:scale(.985)}
.stg.on{background:var(--halo); border-color:var(--teal)}
.stg.dim{opacity:.34}
.stg.lens{border-color:var(--teal)}
.stg .n{font-family:"Instrument Serif",Georgia,serif; font-size:34px; line-height:1;
  color:var(--sod)}
.stg.on .n{color:var(--teal)}
.stg .t{font-size:14.5px; font-weight:600; line-height:1.3}
.stg::after{content:""; position:absolute; left:0; right:0; bottom:0; height:3px;
  background:var(--sod); opacity:.22}
.stg.on::after{opacity:.9; background:var(--teal)}
.pdet{flex:1; min-height:0; display:grid; grid-template-columns:1fr 400px; gap:20px}
.pdl{display:flex; flex-direction:column; gap:16px; min-height:0}
.pdl .card{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch}
.imp{display:flex; flex-direction:column; gap:11px; margin-top:16px}
.imp div{display:flex; gap:12px; align-items:flex-start; font-size:15.5px;
  color:var(--ink2); line-height:1.45}
.imp i{width:9px; height:9px; border-radius:50%; margin-top:7px; flex:none}
.imp .good{background:var(--teal)} .imp .bad{background:var(--sod)}

/* ══════════ the reach ══════════ */
.reach{display:grid; grid-template-columns:1fr 400px; gap:22px; height:100%}
.rmap{position:relative; border-radius:18px; overflow:hidden; background:var(--panel);
  border:1px solid var(--line)}
.rlist{display:flex; flex-direction:column; gap:11px; min-height:0; overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.rgb{display:flex; align-items:center; gap:18px; min-height:76px; padding:0 22px;
  border-radius:16px; background:var(--surf); border:1px solid var(--line);
  transition:background .18s, border-color .18s, opacity .35s, transform .1s}
.rgb:active{transform:scale(.99)}
.rgb.on{background:var(--halo); border-color:var(--teal)}
.rgb.dim{opacity:.34}
.rgb b{font-family:"Instrument Serif",Georgia,serif; font-size:34px; line-height:1;
  color:var(--teal); min-width:52px}
.rgb .t{font-size:17px; font-weight:600}
.rgb .s{font-size:13px; color:var(--ink3); margin-top:2px}

/* ══════════ the record ══════════ */
.rec{display:flex; flex-direction:column; gap:20px; height:100%}
.axis{position:relative; flex:0 0 172px; padding:0 12px}
.arail{position:absolute; left:12px; right:12px; top:34px; height:2px;
  background:var(--line2)}
.afill{position:absolute; left:12px; top:34px; height:2px; background:var(--teal)}
/* two rows of 64pt squares. Row 1 is for dates whose neighbour is closer than one
   target width; a leader line takes it back to its true position on the rail. */
.yr{position:absolute; transform:translateX(-50%); width:64px; height:64px}
.yr.r0{top:3px}
.yr.r1{top:71px}
.yr .lead{position:absolute; left:50%; bottom:100%; margin-bottom:-3px; width:1.5px;
  height:37px; background:var(--line2); transform:translateX(-50%)}
.yr.on .lead{background:var(--teal)}
.yr i{position:absolute; left:50%; top:50%; width:14px; height:14px; border-radius:50%;
  background:var(--ink3); border:2px solid var(--void); display:block;
  transform:translate(-50%,-50%); transition:background .25s, transform .25s}
.yr.on i{background:var(--teal); transform:translate(-50%,-50%) scale(1.6)}
.yr.lens i{background:var(--sod)}
.yr.dim i{opacity:.3}
.yr span{position:absolute; top:calc(50% + 15px); left:50%; transform:translateX(-50%);
  font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--ink3);
  opacity:0; transition:opacity .25s; white-space:nowrap}
.yr.on span{opacity:1; color:var(--teal)}
.yr.r1 span{top:calc(50% + 15px)}
.rbody{flex:1; min-height:0; display:grid; grid-template-columns:1fr 420px; gap:20px}
.rnow{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.fct{padding:20px 22px; border-radius:15px; background:var(--surf);
  border:1px solid var(--line); display:flex; flex-direction:column; justify-content:center}
.fct b{font-family:"Instrument Serif",Georgia,serif; font-size:38px; line-height:1}
.fct .sl{margin-top:7px}
.fct p{margin:8px 0 0; font-size:13px; color:var(--ink3); line-height:1.45}

/* ══════════ the desk ══════════ */
.desk{display:flex; flex-direction:column; gap:18px; height:100%}
.dtabs{display:flex; gap:12px; flex:none}
.dt{min-height:64px; display:flex; align-items:center; padding:0 26px; font-size:17px;
  font-weight:500; color:var(--ink2); border-radius:14px; background:var(--surf);
  border:1px solid var(--line); transition:background .16s, color .16s, transform .1s}
.dt:active{transform:scale(.98)}
.dt.on{background:var(--sod); border-color:var(--sod); color:var(--void); font-weight:600}
.dbody{flex:1; min-height:0}
.cols3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; height:100%}
.col{padding:26px 28px; border-radius:18px; background:var(--surf);
  border:1px solid var(--line); display:flex; flex-direction:column; gap:16px}
.col ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:13px}
.col li{font-size:15.5px; color:var(--ink2); line-height:1.45; padding-left:18px;
  position:relative}
.col li::before{content:""; position:absolute; left:0; top:9px; width:7px; height:7px;
  border-radius:50%; background:var(--sod)}
/* flex:1 + min-height:0, never height:100% — a percentage height inside a flex column
   that already has a sibling over-constrains the box and pushes its last rows off the
   bottom of the screen. That bug shipped silently in the Night Shift build. */
.vst{display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:minmax(0,1fr); gap:15px;
  flex:1; min-height:0}
.vs{display:flex; gap:18px; padding:22px 24px; border-radius:16px; background:var(--surf);
  border:1px solid var(--line); align-items:flex-start}
.vs b{flex:none; width:44px; height:44px; border-radius:50%; background:var(--sod);
  color:var(--void); font-size:18px; font-weight:700; display:flex;
  align-items:center; justify-content:center}
.vs .t{font-size:17px; font-weight:600; margin-bottom:6px}
.vs .d{font-size:15px; color:var(--ink2); line-height:1.5}
.qr{display:flex; align-items:center; gap:22px}
.qrx{width:118px; height:118px; border-radius:12px; background:#F6FBFA; flex:none;
  display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(5,1fr);
  padding:12px; gap:5px}
.qrx i{background:#0B1214; border-radius:2px}
.qrx i.o{background:transparent}

/* ══════════ CORRECTION 3 — the tour, rebuilt for handover ══════════
   Two rows. The top row is what the host says and how they move; the bottom row is
   what the guest does. Fixed height, because content that reflows under a delegation's
   eyes is worse than content that clips. */
.tour{position:absolute; left:26px; right:26px; z-index:46; height:206px;
  bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:12px; padding:16px 18px 14px;
  background:rgba(12,20,22,.96); border:1px solid var(--teal); border-radius:20px;
  opacity:0; visibility:hidden; transform:translateY(12px);
  transition:opacity .3s, transform .3s, visibility .3s}
.tour.on{opacity:1; visibility:visible; transform:none}
.tmain{display:flex; align-items:flex-start; gap:20px; flex:none}
.tcap{flex:1; min-width:0; padding:2px 0 0 8px}
.tcap b{display:block; font-family:"JetBrains Mono",monospace; font-size:10.5px;
  font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--teal);
  margin-bottom:6px}
.tcap span{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; font-size:16.5px; line-height:1.42; color:var(--ink)}
.tctl{display:flex; gap:10px; flex:none}
.tb{min-height:64px; display:flex; align-items:center; justify-content:center; gap:10px;
  padding:0 24px; border-radius:14px; font-size:16.5px; font-weight:600;
  background:var(--surf); border:1px solid var(--line2); flex:none;
  transition:background .2s, color .2s, border-color .2s, transform .1s}
.tb:active{transform:scale(.97)}
.tb.pri{background:var(--teal); color:var(--void); border-color:var(--teal)}
/* never a dead end: before the task is done the forward button is a quiet Skip, not a
   disabled one. Nobody is trapped by a task they cannot find. */
.tb.wait{background:transparent; color:var(--ink3); border-color:var(--line)}
.tb.hide{opacity:.3; pointer-events:none}
.trow{display:flex; align-items:center; gap:18px; min-height:64px; flex:none;
  padding:0 22px; border-radius:14px; background:var(--surf);
  border:1px solid var(--line2);
  transition:background .3s var(--ease), border-color .3s var(--ease)}
.tlbl{flex:none; font-family:"JetBrains Mono",monospace; font-size:10.5px;
  font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--sod)}
.trow.ok .tlbl{color:var(--teal)}
.ttask{flex:1; min-width:0; font-size:18px; line-height:1.35; color:var(--ink)}
.trow.ok .ttask{color:var(--ink2)}
.ttick{flex:none; width:30px; height:30px; color:var(--teal); opacity:0;
  transition:opacity .2s}
.ttick svg{width:30px; height:30px; display:block}
.trow.ok .ttick{opacity:1}
.tdots{display:flex; gap:8px; justify-content:center; flex:none; padding-top:2px}
.tdots i{width:9px; height:9px; border-radius:50%; background:var(--line2); display:block;
  transition:background .25s, transform .25s}
.tdots i.past{background:var(--ink3)}
.tdots i.on{background:var(--teal); transform:scale(1.35)}
/* the body gives the tour bar its room, and takes it back on exit */
.tourmode .body{bottom:250px}
.tourmode .body.bleed{bottom:228px}
.tourmode .obj{bottom:244px}
.tourmode .lgnd{opacity:0}

/* ══════════ CORRECTION 1 — the attract screen ══════════
   The most designed thing in the app, because it is the only surface that changes how
   many people use the app at all. Full-bleed night scene, one fact at a time, and a
   single moving touch signifier. The scrim is angled so the left third stays dark —
   "room at the left for type" is the constraint shot 01 is briefed to. */
.atr{position:absolute; inset:0; overflow:hidden}
.natt{position:absolute; inset:0}
.natt svg,.nphoto{width:100%; height:100%; display:block; object-fit:cover}
.ascrim{position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(100deg,rgba(3,8,10,.88) 0%,rgba(3,8,10,.76) 18%,
      rgba(3,8,10,.52) 32%,rgba(3,8,10,.26) 46%,rgba(3,8,10,.08) 58%,
      rgba(3,8,10,0) 70%),
    linear-gradient(0deg,rgba(3,8,10,.92) 0%,rgba(3,8,10,.78) 10%,
      rgba(3,8,10,.56) 19%,rgba(3,8,10,.34) 27%,rgba(3,8,10,.16) 36%,
      rgba(3,8,10,.05) 44%,rgba(3,8,10,0) 52%)}
.amk{position:absolute; left:66px; top:58px; line-height:1}
.amk b{display:block; font-size:36px; font-weight:500}
.amk i{display:block; font-style:normal; font-size:12px; font-weight:700;
  letter-spacing:.34em; color:var(--ink2); margin-top:8px}
.aplace{position:absolute; left:66px; top:134px; margin:0;
  font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink3)}
.afacts{position:absolute; left:66px; top:286px; width:660px; height:340px}
.afact{position:absolute; left:0; top:0; width:100%; opacity:0; visibility:hidden}
.afact.on{opacity:1; visibility:visible}
.afig{font-family:"Instrument Serif",Georgia,serif; font-size:158px; line-height:.8;
  letter-spacing:-.025em}
/* the % and the + ride at cap height, not on the baseline, where they read as
   subscripts hanging off the numeral */
.afig span{font-size:.3em; color:var(--teal); margin-left:3px; position:relative;
  top:-.82em}
.alede{font-family:"Instrument Serif",Georgia,serif; font-size:36px; line-height:1.2;
  color:var(--ink); margin:30px 0 0; max-width:17ch}
/* 64 × 64 of grain at 5%, over the whole attract screen. A near-black vertical
   gradient bands visibly in 8-bit — there was a hard horizontal seam across the water
   — and a dither is both the cheapest fix and the right texture for a night
   photograph's stand-in. */
.agrain{position:absolute; inset:0; pointer-events:none; opacity:.05;

<script>
/* ══════════ drawings ══════════
   The plan geometry is carried over from the Night Shift build — it is traced from the
   real complex and is the best asset in the project.

   What changed for the Threshold build: the viewBox is now fixed and everything lives
   inside #pcam, a single transform group. The camera moves by tweening that group
   rather than by re-rendering the SVG with a different viewBox, which is what lets
   opening a plant PAN THE PLAN so the plant you picked is not underneath the panel that
   just covered the right third of the screen. That pan is the point: it answers "where
   did it go" before the question is asked.

   DY folds the plan's vertical centring into world space, so a block at BLOCKS y is at
   world y + DY. Every camera target in t-app.js uses world coordinates. */
var DY = 132;

function planSVG(hot){
  var s = [];
  s.push('<svg class="plan" viewBox="0 0 1366 1024" preserveAspectRatio="xMidYMid slice" ' +
    'role="img" aria-label="Schematic plan of the QAFCO complex at Mesaieed: seven ' +
    'ammonia and urea trains plus ICPR, linked by product pipeline to two export ' +
    'jetties on the Gulf.">');
  /* the ground extends well past the frame so a zoomed camera never finds an edge */
  s.push('<rect x="-800" y="-600" width="3200" height="2400" fill="var(--land)"/>');
  s.push('<g id="pcam">');
  s.push('<g transform="translate(0 ' + DY + ')">');
  s.push('<path d="M2000 -600 L1010 -600 L1010 0 C1040 160,1080 300,1120 420 C1150 520,' +
    '1200 640,1240 760 L1240 1500 L2000 1500 Z" fill="var(--water)"/>');
  s.push('<path d="M1010 0 C1040 160,1080 300,1120 420 C1150 520,1200 640,1240 760" ' +
    'fill="none" stroke="var(--coast)" stroke-width="2"/>');
  s.push('<g stroke="var(--road)" stroke-width="1.5" fill="none">' +
    '<path d="M-400 612 C300 594,620 566,900 548 S1120 552,1178 566"/>' +
    '<path d="M624 -40 C612 180,596 300,636 420 S622 640,616 800"/>' +
    '<path d="M-400 246 C220 236,360 222,524 226"/></g>');
  s.push('<g fill="#41565B"><rect x="1038" y="146" width="188" height="9" rx="4"/>' +
    '<rect x="1106" y="376" width="176" height="9" rx="4"/>' +
    '<rect x="1196" y="127" width="56" height="14" rx="7" opacity=".75"/>' +
    '<rect x="1252" y="357" width="56" height="14" rx="7" opacity=".75"/></g>');
  s.push('<g fill="var(--ink3)" font-size="15" font-family="Archivo,Arial,sans-serif">' +
    '<text x="1238" y="180">Jetty 1</text><text x="1294" y="410">Jetty 2</text></g>');
  /* the product pipeline: dashed, and it animates once on arrival so the direction of
     flow — plant to jetty — is stated rather than left to be inferred */
  s.push('<polyline id="ppipe" points="532,588 626,522 700,432 790,352 855,268 960,180 1040,150" ' +
    'fill="none" stroke="var(--sod)" stroke-width="3.5" stroke-dasharray="11 9" ' +
    'stroke-linecap="round" opacity=".85"/>');
  BLOCKS.forEach(function(b){
    var n = b[0], nm = b[1], x = b[2], y = b[3], w = b[4], h = b[5],
        cx = x + w / 2, cy = y + h / 2;

      ' data-hit="1" role="button" tabindex="0" aria-label="' + nm + '"' : '') + '>');
    s.push('<rect class="bhalo" x="' + (x - 9) + '" y="' + (y - 9) + '" width="' + (w + 18) +
      '" height="' + (h + 18) + '" rx="13" fill="none" stroke="var(--teal)" stroke-width="2"/>');
    s.push('<rect class="b" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
      '" rx="8" fill="var(--fill)" stroke="rgba(63,199,196,.5)" stroke-width="1.5"/>');
    s.push('<circle cx="' + cx + '" cy="' + cy + '" r="25" fill="var(--void)" ' +
      'stroke="var(--teal)" stroke-width="2"/>');
    s.push('<text x="' + cx + '" y="' + (cy + 8) + '" text-anchor="middle" font-size="22" ' +
      'font-weight="600" fill="var(--teal)" font-family="Archivo,Arial,sans-serif">' + n + '</text>');
    s.push('<text x="' + cx + '" y="' + (y + h + 26) + '" text-anchor="middle" font-size="17" ' +
      'fill="var(--ink2)" font-family="Archivo,Arial,sans-serif">' + nm + '</text>');
    /* an 80pt square of nothing, so a finger never has to find the ring */
    if (hot) s.push('<rect x="' + (cx - 40) + '" y="' + (cy - 40) + '" width="80" height="80" ' +
      'fill="transparent"/>');
    s.push('</g>');
  });
  s.push('</g></g></svg>');
  return s.join('');
}

    s.push('<text x="' + (e[0] - 14) + '" y="' + (e[1] + 6) + '" text-anchor="end" ' +
      'font-size="13" fill="var(--ink3)" font-family="Archivo,Arial,sans-serif">' +
      r[1] + ' countries</text>');
    s.push('</g>');
  });
  s.push('</svg>');
  return s.join('');

/* A QR block that is obviously a QR code and obviously not a real one. */
function qrSVG(){
  var on = [0,1,2,4,5,9,10,11,12,14,15,16,18,20,21,22,24];

  for (var i = 0; i < 25; i++) h += '<i class="' + (on.indexOf(i) > -1 ? '' : 'o') + '"></i>';
  return h + '</div>';
}

      '<stop offset="1" stop-color="#1C4E58" stop-opacity="0"/></linearGradient>' +
    '<filter id="nSoft" x="-70%" y="-30%" width="240%" height="170%">' +
      '<feGaussianBlur stdDeviation="9"/></filter>' +
    '</defs>';
}

/* ── the three depth planes ───────────────────────────────────────────────────── */
function fringe(r, base, fill, op, n, hi){
  var s = ['<g fill="' + fill + '" opacity="' + op + '">'], i;
  for (i = 0; i < n; i++){
    var x = -40 + r() * (W + 80), w = 14 + r() * 70, h = 8 + r() * hi;
    s.push('<rect x="' + x.toFixed(0) + '" y="' + (base - h).toFixed(0) + '" width="' +
      w.toFixed(0) + '" height="' + (h + 24).toFixed(0) + '"/>');
    if (r() > .78) s.push('<rect x="' + (x + w * .4).toFixed(0) + '" y="' +
      (base - h - 26 - r() * 30).toFixed(0) + '" width="6" height="' +
      (30 + r() * 30).toFixed(0) + '"/>');
  }
  return s.join('') + '</g>';
}

function forms(r){
  var s = [], lamps = [], i;
  function lamp(x, y, teal){ lamps.push([x, y, teal ? 1 : 0]); }

  /* pipe racks tie the trains together and give the run a horizontal spine */
  s.push('<g fill="none" stroke="#071519" stroke-width="6">' +
    '<path d="M270 614 H1230"/><path d="M300 634 H1330"/></g>');
  s.push('<g fill="#071519">');
  for (i = 276; i < 1330; i += 54) s.push('<rect x="' + i + '" y="610" width="4" height="46"/>');
  s.push('</g>');

  s.push('<g class="nForm" fill="#030A0D">');

  SPHERE.forEach(function(sp){
    var cy = HZ - sp[1] - 14;
    s.push('<circle cx="' + sp[0] + '" cy="' + cy + '" r="' + sp[1] + '"/>');
    s.push('<rect x="' + (sp[0] - sp[1] * .55) + '" y="' + cy + '" width="' +
      (sp[1] * 1.1) + '" height="' + (sp[1] + 16) + '"/>');
    lamp(sp[0] - sp[1] * .8, cy + sp[1] * .55);
    lamp(sp[0] + sp[1] * .8, cy + sp[1] * .5);
  });

  FORM.forEach(function(f){
    var x = f[0], w = f[1], h = f[2], k = f[3], y = HZ - h, n, ly, c;

    if (k === 't'){
      /* the prill tower — slab sides, a slight waist and a wider head. This one shape
         is what stops the skyline reading as a refinery or a city. */
      s.push('<path d="M' + x + ' ' + HZ + ' L' + (x + w * .1) + ' ' + (y + 30) +
        ' L' + (x - 6) + ' ' + (y + 26) + ' L' + (x - 6) + ' ' + y +
        ' L' + (x + w + 6) + ' ' + y + ' L' + (x + w + 6) + ' ' + (y + 26) +
        ' L' + (x + w - w * .1) + ' ' + (y + 30) + ' L' + (x + w) + ' ' + HZ + ' Z"/>');
      s.push('<rect x="' + (x + w * .3) + '" y="' + (y - 16) + '" width="' + (w * .4) +
        '" height="18"/>');
    } else if (k === 'r'){
      /* the reformer: a long box with a row of short stacks on the roof */
      s.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>');
      for (n = 0; n < 5; n++){
        var sx = x + 9 + n * ((w - 18) / 4);
        s.push('<rect x="' + (sx - 4) + '" y="' + (y - 44) + '" width="8" height="46"/>');
      }
      s.push('<rect x="' + (x - 4) + '" y="' + (y - 4) + '" width="' + (w + 8) + '" height="6"/>');
      lamp(x + 6, y + 10); lamp(x + w - 6, y + 12);
    } else if (k === 'g'){
      /* the granulation shed: long, low, with cyclones along the ridge */
      s.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>');
      for (n = 0; n < 6; n++){
        var gx = x + 14 + n * ((w - 28) / 5);
        s.push('<rect x="' + (gx - 7) + '" y="' + (y - 28) + '" width="14" height="30" rx="6"/>');
      }
      lamp(x + 8, y + 8); lamp(x + w / 2, y + 6); lamp(x + w - 8, y + 8);
    } else {
      s.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/>');
      if (k === 's') s.push('<rect x="' + (x - 3) + '" y="' + y + '" width="' + (w + 6) +
        '" height="8"/>');
    }

    /* platform rings: three thin bands, the detail that says "process equipment" */
    if (k === 'c' || k === 't'){
      for (n = 1; n <= 3; n++){
        ly = y + h * n / 4;
        s.push('<rect x="' + (x - 6) + '" y="' + ly + '" width="' + (w + 12) + '" height="3.5"/>');
        lamp(x - 6 + (n % 2 ? 0 : w + 12), ly + 2, false);
      }
      if (h > 160) s.push('<circle class="nAv" cx="' + (x + w / 2) + '" cy="' + (y - 6) +
        '" r="3.2" fill="#FF4D42"/>');
    }
    /* equipment banding on the blocks, not office windows — a plant at night is lit
       from outside, and a grid of warm squares turns it into a business park */
    if (k === 'b'){
      for (n = 1; n * 26 < h; n++)
        s.push('<rect x="' + (x - 3) + '" y="' + (y + n * 26) + '" width="' + (w + 6) +
          '" height="3"/>');
      lamp(x + 4, y + 5); lamp(x + w - 4, y + 5);
      if (w > 60) lamp(x + w / 2, y + 4);
    }
    if (k === 's') s.push('<circle class="nAv" cx="' + (x + w / 2) + '" cy="' + (y - 5) +
      '" r="2.8" fill="#FF4D42"/>');
  });

  /* the flare mast */
  s.push('<rect x="' + FLARE.x + '" y="' + (HZ - FLARE.h) + '" width="' + FLARE.w +
    '" height="' + FLARE.h + '"/>');
  for (i = 1; i <= 7; i++) s.push('<rect x="' + (FLARE.x - 7) + '" y="' +
    (HZ - FLARE.h * i / 8) + '" width="' + (FLARE.w + 14) + '" height="2.6"/>');
  s.push('<path d="M' + (FLARE.x - 26) + ' ' + HZ + ' L' + (FLARE.x - 3) + ' ' +
    (HZ - 150) + ' L' + (FLARE.x + FLARE.w + 3) + ' ' + (HZ - 150) + ' L' +
    (FLARE.x + FLARE.w + 26) + ' ' + HZ + ' Z" opacity=".9"/>');

  /* the jetty — the thing that makes "45 countries" a physical fact. It comes toward
     the viewer, which is what sells the elevated vantage. */
  s.push('<path d="M1122 ' + (HZ + 4) + ' L1366 ' + (HZ + 4) + ' L1366 ' + (HZ + 30) +
    ' L1122 ' + (HZ + 16) + ' Z"/>');
  for (i = 1140; i < 1366; i += 30)
    s.push('<rect x="' + i + '" y="' + (HZ + 12) + '" width="5" height="34"/>');
  s.push('<rect x="1232" y="' + (HZ - 56) + '" width="9" height="62"/>');
  s.push('<rect x="1300" y="' + (HZ - 44) + '" width="9" height="50"/>');
  s.push('</g>');

  /* quay lamps and the flare-mast head light, drawn over everything */
  for (i = 1136; i < 1362; i += 30) lamp(i + 2, HZ + 5, true);
  lamp(1236, HZ - 56, true); lamp(1304, HZ - 44, true);
  lamp(FLARE.x + FLARE.w / 2, HZ - FLARE.h * .5);

  /* a scatter of ground-level lamps along the whole run */
  for (i = 0; i < 46; i++) lamp(210 + r() * 1090, HZ - 4 - r() * 22, r() > .86);

  s.push('<g id="nLamps">');
  lamps.forEach(function(l){
    s.push('<circle cx="' + l[0].toFixed(1) + '" cy="' + l[1].toFixed(1) + '" r="' +
      (l[2] ? 12 : 10) + '" fill="url(#' + (l[2] ? 'nLampT' : 'nLamp') + ')"/>');
    s.push('<circle cx="' + l[0].toFixed(1) + '" cy="' + l[1].toFixed(1) +
      '" r="1.4" fill="' + (l[2] ? '#E6FFFE' : '#FFF3DC') + '" opacity=".9"/>');
  });
  s.push('</g>');
  return {svg: s.join(''), lamps: lamps};
}

/* ── the water ────────────────────────────────────────────────────────────────── */
function water(lamps){
  var s = ['<rect x="0" y="' + HZ + '" width="' + W + '" height="' + (H - HZ) +
    '" fill="url(#nWatG)"/>'];
  /* Reflections are short and clipped to a band. The previous version ran them the
     full height of the water and the result read as a barcode. */
  s.push('<g id="nRef" opacity=".62">');
  lamps.forEach(function(l, i){
    if (i % 2) return;
    var len = 34 + (i % 9) * 9;
    s.push('<rect x="' + (l[0] - 2.6).toFixed(1) + '" y="' + (HZ + 1) + '" width="5.2" ' +
      'height="' + len + '" fill="url(#nRefG)" opacity="' +
      (.22 + (i % 5) * .05).toFixed(2) + '"/>');
  });
  /* the flare's own reflection is the longest thing on the water */
  s.push('<rect x="' + (FLARE.x - 8) + '" y="' + (HZ + 1) + '" width="26" height="168" ' +
    'fill="url(#nRefG)" opacity=".3"/>');
  s.push('</g>');
  /* three soft swells, not a grid of ripple lines — low opacity, or the edges read as
     seams rather than water */
  s.push('<g fill="#020709" opacity=".22">' +
    '<ellipse cx="683" cy="' + (HZ + 84) + '" rx="900" ry="22"/>' +
    '<ellipse cx="420" cy="' + (HZ + 142) + '" rx="760" ry="28"/>' +
    '<ellipse cx="980" cy="' + (HZ + 208) + '" rx="820" ry="34"/></g>');
  s.push('<path d="M0 ' + HZ + ' H' + W + '" stroke="#3C8A92" stroke-width="1.2" opacity=".55"/>');
  /* the near quay, and three out-of-focus lamps in it */
  s.push('<g id="nBok"><circle cx="180" cy="962" r="104" fill="url(#nBokeh)"/>' +
    '<circle cx="742" cy="1002" r="132" fill="url(#nBokeh)"/>' +
    '<circle cx="1186" cy="948" r="118" fill="url(#nBokeh)"/></g>');
  s.push('<rect x="0" y="874" width="' + W + '" height="150" fill="url(#nFore)"/>');
  return s.join('');
}

/* ── build ────────────────────────────────────────────────────────────────────── */
function svg(){
  var r = rng(20260912), s = [], i;
  s.push('<svg id="nsvg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice" ' +
    'role="img" aria-label="The QAFCO complex at Mesaieed at night: ammonia and urea ' +
    'trains lit along the shore, the flare burning, and the export jetty reaching into ' +
    'the Gulf.">');
  s.push(defs());
  s.push('<g id="nScene">');

  s.push('<rect width="' + W + '" height="' + (HZ + 2) + '" fill="url(#nSkyG)"/>');

  s.push('<g id="nStars" fill="#CFE6E4">');
  for (i = 0; i < 40; i++) s.push('<circle cx="' + (r() * W).toFixed(0) + '" cy="' +
    (r() * 300).toFixed(0) + '" r="' + (r() > .82 ? 1.5 : 1) + '" opacity="' +
    (.14 + r() * .3).toFixed(2) + '"/>');
  s.push('</g>');

  /* the light the plant throws back into the sky, before the plant is drawn */
  s.push('<ellipse cx="900" cy="' + HZ + '" rx="620" ry="300" fill="url(#nWarm)"/>');
  s.push('<ellipse cx="330" cy="' + HZ + '" rx="440" ry="220" fill="url(#nCool)"/>');

  /* three depth planes. Qatar is flat, so the far ones are other industry on the
     horizon, not hills — and they sit HIGHER than the near run, which is what an
     elevated vantage looks like. */
  s.push(fringe(r, FZ, '#08191F', .55, 30, 26));
  s.push('<rect id="nHaze1" x="-180" y="' + (FZ - 40) + '" width="1740" height="74" ' +
    'fill="url(#nHazeG)" opacity=".7"/>');
  s.push(fringe(r, MZ, '#051217', .8, 22, 52));

  var f = forms(r);
  s.push(f.svg);

  s.push('<rect id="nHaze2" x="-240" y="' + (HZ - 54) + '" width="1860" height="66" ' +
    'fill="url(#nHazeG)" opacity=".5"/>');

  /* steam — from the reformer, the prill tower head and the granulation shed */
  s.push('<g id="nSteam" filter="url(#nSoft)">');
  [[448, HZ - 130, 30], [682, HZ - 288, 24], [826, HZ - 118, 36]].forEach(function(p, n){
    s.push('<ellipse class="nPlume" data-n="' + n + '" cx="' + p[0] + '" cy="' + p[1] +
      '" rx="' + p[2] + '" ry="' + (p[2] * .7) + '" fill="url(#nSteamG)" opacity="0"/>');
  });
  s.push('</g>');

  /* the flare. The glow is a gradient disc; only the flame body animates. */
  var ft = HZ - FLARE.h, fcx = FLARE.x + FLARE.w / 2;
  s.push('<circle id="nGlow" cx="' + fcx + '" cy="' + (ft - 24) + '" r="190" ' +
    'fill="url(#nFlareG)"/>');
  s.push('<path id="nFlameP" d="M' + fcx + ' ' + (ft + 8) +
    ' C' + (fcx - 20) + ' ' + (ft - 20) + ',' + (fcx - 13) + ' ' + (ft - 50) + ',' + fcx +
    ' ' + (ft - 80) + ' C' + (fcx + 15) + ' ' + (ft - 48) + ',' + (fcx + 19) + ' ' +
    (ft - 18) + ',' + fcx + ' ' + (ft + 8) + ' Z" fill="url(#nFlame)"/>');

  s.push(water(f.lamps));

  s.push('</g></svg>');
  return s.join('');
}

/* ── motion ───────────────────────────────────────────────────────────────────────
   Everything here is ambient: long, slow, and carrying no information a visitor has to
   read. It runs only while the attract screen is on screen, and not at all under
   prefers-reduced-motion — ambient motion is the one category where suppression, not
   parity, is the right answer. */
function motion(g, reduced){
  if (reduced || !g) {
    if (g){ g.set('#nFlameP', {opacity:.92}); g.set('.nPlume', {opacity:.2}); }
    return null;
  }
  var q = [];
  var fcx = FLARE.x + FLARE.w / 2, ft = HZ - FLARE.h;

  /* Ken Burns. svgOrigin, not transformOrigin — on an SVG group GSAP measures
     transformOrigin against the bounding box, which is not the viewBox. That mistake
     cost a full debugging session in the touch prototype. */
  g.set('#nScene', {svgOrigin:'683 652'});
  q.push(g.to('#nScene', {scale:1.05, x:-14, y:5, duration:58, ease:'sine.inOut',
    repeat:-1, yoyo:true}));

  g.set('#nFlameP', {svgOrigin:fcx + ' ' + (ft + 8)});
  q.push(g.to('#nFlameP', {keyframes:[
      {scaleY:1.16, scaleX:.9,  opacity:.96, duration:1.1},
      {scaleY:.88,  scaleX:1.1, opacity:.82, duration:.9},
      {scaleY:1.05, scaleX:.96, opacity:1,   duration:1.3},
      {scaleY:.95,  scaleX:1.04,opacity:.88, duration:.8}
    ], ease:'sine.inOut', repeat:-1}));
  g.set('#nGlow', {svgOrigin:fcx + ' ' + (ft - 24)});
  q.push(g.to('#nGlow', {scale:1.1, opacity:.74, duration:2.3, ease:'sine.inOut',
    repeat:-1, yoyo:true}));

  q.push(g.fromTo('.nAv', {opacity:.1}, {opacity:1, duration:.9, ease:'sine.inOut',
    repeat:-1, yoyo:true, stagger:{each:.37, from:'random'}}));

  /* plumes: rise, spread, dissolve. Three offset loops, so the sky is never still and
     never rhythmic. */
  [[0, 0, 17], [1, 6.5, 21], [2, 12, 15]].forEach(function(p){
    q.push(g.fromTo('.nPlume[data-n="' + p[0] + '"]', {y:0, scale:.6, opacity:0},
      {y:-180, scale:2.2, opacity:.5, duration:p[2], delay:p[1], ease:'none', repeat:-1}));
    q.push(g.to('.nPlume[data-n="' + p[0] + '"]', {opacity:0, duration:p[2] * .45,
      delay:p[1] + p[2] * .55, ease:'sine.in', repeat:-1, repeatDelay:p[2] * .55}));
  });

  q.push(g.to('#nHaze1', {x:110, duration:74, ease:'sine.inOut', repeat:-1, yoyo:true}));
  q.push(g.to('#nHaze2', {x:-130, duration:96, ease:'sine.inOut', repeat:-1, yoyo:true}));

  g.set('#nRef', {svgOrigin:'683 ' + HZ});
  q.push(g.to('#nRef', {scaleY:1.1, opacity:.44, duration:7.5, ease:'sine.inOut',
    repeat:-1, yoyo:true}));
  q.push(g.to('#nStars', {opacity:.6, duration:11, ease:'sine.inOut', repeat:-1, yoyo:true}));

  return {kill: function(){ q.forEach(function(t){ t.kill(); }); }};
}

return {svg:svg, motion:motion, HZ:HZ};
})();

</script>
<script>
/* ══════════════════ motion ══════════════════
   One rule, inherited from the Mesaieed design system and not relaxed here:
   motion carries information or it does not run.

   Character: calm and architectural. Weighted eases, 300–900ms, nothing overshoots.
   Panels slide and settle; the plan pans like a camera on rails. The app should feel
   like heavy things moving accurately, because that is what it is about.

   REDUCED MOTION is parity, not suppression: every informational timeline is built
   exactly as it would be and then run to progress(1), so a visitor who has the setting
   on sees the same end state, instantly, with nothing missing. The one exception is the
   ambient loop on the attract screen, which carries no information and simply does not
   start. */

var MO = (function(){
"use strict";
var g = window.gsap;
var rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* duration tokens — the whole vocabulary, so nothing is typed ad hoc */
var D = {xs:.16, s:.28, m:.46, l:.66, xl:.9};
/* ease tokens — arriving, leaving, travelling */
var E = {out:'power3.out', in:'power2.in', io:'power2.inOut', soft:'sine.inOut'};

function ok(){ return !!g; }

/* Every finite timeline is built exactly as it would be and then, under reduced motion,
   run to the end — which is what keeps the two experiences identical at rest. Note that
   done() must be called AFTER the children are added: completing an empty timeline and
   then adding tweens to it does the opposite of what it looks like. */
function tl(cfg){ return g.timeline(cfg || {}); }
function done(t){ if (rm && t) t.progress(1, false); return t; }

/* ══════════ room transitions ══════════
   The outgoing room drops and dissolves; the incoming one rises into place with its
   major blocks staggered left to right. The overlap keeps the whole change under 640ms,
   which is inside the four-second budget with room to spare. */
function roomChange(el, swap, dir){
  if (rm) { swap(); return null; }
  var d = dir === 'back' ? 1 : -1;
  var t = g.timeline();
  t.to(el, {opacity:0, y:10 * -d, duration:D.s, ease:E.in})
   .add(function(){ swap(); })
   .set(el, {opacity:1, y:0})
   .add(function(){
     /* [data-en] marks the two or three blocks each room wants staggered. Falling back
        to el.children would animate a single full-bleed wrapper and say nothing. */
     var kids = el.querySelectorAll('[data-en]');
     g.from(kids.length ? kids : el.children,
       {opacity:0, y:18 * -d, duration:D.l, ease:E.out,
        stagger:{each:.06, from:'start'}, clearProps:'transform,opacity'});
   });
  return t;
}

/* The room name rolls rather than swaps, so a glance at the top strip tells you the
   context changed even if you were looking at the bottom bar when you tapped. */
function nameRoll(el){
  if (!el) return;
  done(g.from(el, {yPercent:38, opacity:0, duration:D.m, ease:E.out,
                   clearProps:'transform,opacity'}));
}

/* ══════════ the detail swap ══════════
   Inside a room, changing the stage / year / region slides the detail in from the side
   you moved. Direction is the information: you can feel you went forward. */
function detail(el, d){
  if (!el) return;
  done(g.from(el, {opacity:0, x:22 * (d < 0 ? -1 : 1), duration:D.m, ease:E.out,
                   clearProps:'transform,opacity'}));
}

/* ══════════ the plan camera ══════════
   svgOrigin, not transformOrigin. On an SVG group GSAP measures transformOrigin against
   the element's bounding box, which for this group does not start at the viewBox origin
   — every move at scale ≠ 1 then lands hundreds of points away. Set once, in bind(). */
var CAM = null;
function camBind(node){
  CAM = node;
  if (!CAM || !g) return;
  g.set(CAM, {svgOrigin:'0 0'});
}
/* put world point (wx,wy) at screen point (sx,sy), at scale k */
function camTo(wx, wy, k, sx, sy, dur){
  if (!CAM || !g) return null;
  var v = {scale:k, x:sx - k * wx, y:sy - k * wy,
           duration:(dur == null ? D.xl : dur), ease:E.io};
  if (rm) { g.set(CAM, {scale:v.scale, x:v.x, y:v.y}); return null; }
  return g.to(CAM, v);
}
var HOME = {wx:730, wy:512, k:1.0194, sx:683, sy:512};
function camHome(dur){ return camTo(HOME.wx, HOME.wy, HOME.k, 683, 512, dur); }

/* ══════════ the lens sweep ══════════
   The signature move, and the one that most clearly earns its place. Switching a lens
   re-weights every room; a snap makes that look like a bug. A band crosses the screen
   and each element changes state as the band reaches it, so the visitor sees the
   re-weighting happen and can tell which things lit and which dimmed.
   apply(el) is called per element, in left-to-right order. */
function sweep(scope, els, apply, reverse){
  if (rm || !g || !els.length){ els.forEach(apply); return null; }
  var band = document.getElementById('sweep');
  var box = scope.getBoundingClientRect();
  var dur = 0.80, lead = 0.62;

  var order = els.map(function(el){
    var b = el.getBoundingClientRect();
    var p = box.width ? ((b.left + b.width / 2) - box.left) / box.width : .5;
    return {el:el, p:Math.max(0, Math.min(1, reverse ? 1 - p : p))};
  });

  var t = g.timeline();
  if (band){
    g.set(band, {opacity:1});
    t.fromTo(band.firstChild,
      {xPercent: reverse ? 118 : -118},
      {xPercent: reverse ? -118 : 118, duration:dur, ease:'power1.inOut'}, 0);
    t.to(band, {opacity:0, duration:D.s}, dur - .18);
  }
  order.forEach(function(o){
    t.add(function(){ apply(o.el); }, .06 + o.p * lead);
  });
  return t;
}

/* ══════════ sheets ══════════ */
function sheetIn(scrim, card){
  var t = tl();
  t.set(scrim, {display:'block'})
   .fromTo(scrim, {opacity:0}, {opacity:1, duration:D.m, ease:E.out}, 0)
   .fromTo(card, {yPercent:102}, {yPercent:0, duration:D.l, ease:E.out}, 0)
   .from(card.querySelectorAll('[data-stg]'),
         {opacity:0, y:16, duration:D.m, ease:E.out, stagger:.05,
          clearProps:'transform,opacity'}, D.s);
  return done(t);
}
function sheetOut(scrim, card, after){
  if (rm) { scrim.style.display = 'none'; if (after) after(); return null; }
  var t = g.timeline({onComplete:function(){ scrim.style.display = 'none'; if (after) after(); }});
  t.to(card, {yPercent:104, duration:D.s, ease:E.in}, 0)
   .to(scrim, {opacity:0, duration:D.s, ease:E.in}, 0);
  return t;
}

/* ══════════ the handover ══════════
   The tick draws rather than appears. It is the only celebratory motion in the app and
   it lasts 420ms, because a guest who has just done what they were asked should be told
   so unmistakably and then left alone. */
function tickDraw(path){
  if (!path || !g) return;
  var len = 26;
  try { len = path.getTotalLength(); } catch(e){}
  done(g.fromTo(path, {strokeDasharray:len, strokeDashoffset:len},
    {strokeDashoffset:0, duration:.42, ease:E.out}));
}
function taskDone(row, btn){
  var t = tl();
  t.to(row, {backgroundColor:'rgba(63,199,196,.14)', borderColor:'rgba(63,199,196,.6)',
             duration:D.m, ease:E.out}, 0);
  if (btn) t.from(btn, {opacity:.35, scale:.97, duration:D.m, ease:E.out,
                        clearProps:'transform'}, .1);
  return done(t);
}
/* The escape hatch: after twelve seconds the app shows the target rather than letting a
   guest stand there failing in front of the room. box-shadow does not exist on an SVG
   element, and half the tour's targets are plant blocks on the plan — so SVG gets a
   pulse on its own halo instead of a shadow that would silently never render. */
function hint(el){
  if (!el || !g || rm) return null;
  if (window.SVGElement && el instanceof window.SVGElement){
    var halo = el.querySelector ? el.querySelector('.bhalo') : null;
    var t = g.timeline({repeat:-1, repeatDelay:.3});
    if (halo) t.fromTo(halo, {opacity:0}, {opacity:.95, duration:.7, ease:'sine.inOut',
                              yoyo:true, repeat:1}, 0);
    t.fromTo(el, {opacity:1}, {opacity:.55, duration:.7, ease:'sine.inOut',
                               yoyo:true, repeat:1}, 0);
    return t;
  }
  return g.fromTo(el, {boxShadow:'0 0 0 0 rgba(63,199,196,.55)'},
    {boxShadow:'0 0 0 16px rgba(63,199,196,0)', duration:1.5, ease:'power2.out',
     repeat:-1, repeatDelay:.35});
}

/* ══════════ the attract touch signifier ══════════
   Finding 08: people frequently fail to recognise a large screen as touchable at all.
   One hand, one ripple, one four-second cycle. Not two. */
function signifier(hand, ring){
  if (rm || !g) return null;
  /* Five-second cycle, and the hand is present for four of them. An earlier version
     spent a third of every loop off-screen, which is exactly the wrong trade for the
     one element whose whole job is to be noticed from across a lobby. */
  var t = g.timeline({repeat:-1, repeatDelay:.5});
  t.set(ring, {scale:.3, opacity:0, transformOrigin:'50% 50%'})
   .fromTo(hand, {y:38, x:14, opacity:0},
                 {y:0, x:0, opacity:1, duration:.85, ease:E.out})
   .to({}, {duration:.45})                                   /* hold, in place */
   .to(hand, {y:7, duration:.18, ease:'power2.in'})          /* contact */
   .set(ring, {scale:.35, opacity:.7})
   .to(ring, {scale:2.6, opacity:0, duration:1.0, ease:'power2.out'})
   .to(hand, {y:0, duration:.34, ease:E.out}, '<')
   .to({}, {duration:.9})                                    /* rest, still visible */
   .to(hand, {y:30, x:12, opacity:0, duration:.55, ease:E.in});
  return t;
}

/* ══════════ attract facts ══════════
   Each fact holds five seconds and crossfades in 700ms — a twenty-second loop, which is
   the revert interval the kiosk research recommends. Someone walking past reads one.
   Someone who slows down reads two. */
function factCycle(items, onShow){
  var i = 0;
  function show(n, first){
    var el = items[n];
    items.forEach(function(x, k){ if (k !== n) x.classList.remove('on'); });
    el.classList.add('on');
    if (onShow) onShow(n);
    if (rm || !g) return;
    g.fromTo(el.querySelectorAll('[data-fl]'),
      {opacity:0, y:22}, {opacity:1, y:0, duration:first ? .9 : .7, ease:E.out,
       stagger:.09, clearProps:'transform,opacity'});
  }
  show(0, true);
  var iv = setInterval(function(){
    i = (i + 1) % items.length;
    if (!rm && g) g.to(items, {opacity:0, duration:.35, ease:E.in,
      onComplete:function(){ g.set(items, {opacity:1}); show(i); }});
    else show(i);
  }, 5000);
  return {kill:function(){ clearInterval(iv); }};
}

return {ok:ok, rm:rm, g:g, D:D, E:E, tl:tl, done:done,
        roomChange:roomChange, nameRoll:nameRoll, detail:detail,
        camBind:camBind, camTo:camTo, camHome:camHome, HOME:HOME,
        sweep:sweep, sheetIn:sheetIn, sheetOut:sheetOut,
        tickDraw:tickDraw, taskDone:taskDone, hint:hint,
        signifier:signifier, factCycle:factCycle};
})();

</script>
<script>
(function(){

var DTABS = ['Our people','Careers','Vendors','Connect'];

var HIST = [], ACT = {};

/* ══════════ CORRECTION 1 — the attract screen ══════════
   Four facts, five seconds each: a twenty-second loop, which is the attract-revert
   interval the kiosk research recommends. Someone walking past reads one. Someone who
   slows down reads two and has a reason to stop. */
var ATTRACT = [
  ['14', '%',  'of the world’s urea comes from this one site.'],

/* ══════════ CORRECTION 3 — the tour, written for handover ══════════

   `after` replaces the caption once the task is complete, so the app says what just

var TOUR = [
  {room:'site', lens:null,
   say:'One site at Mesaieed. Seven ammonia and urea trains plus ICPR — and 14% of the ' +
       'world’s urea leaves from here.',
   task:'Find QAFCO 7 on the plan and open it. It’s the newest one.',

   test:function(){ return S.blk === '7'; },
   after:'QAFCO 7 — under construction, and the largest blue ammonia plant in the world ' +
         'when it comes on stream.'},

  {room:'site', blk:'7', lens:null,
   say:'Notice it isn’t only a place on this map. Everything in this app is connected to ' +
       'everything it belongs to.',
   task:'Tap “2027 in the record”, at the bottom of the panel.',
   hint:'[data-goyear="2027"]',

   say:'This is fifty-eight years of them. The gaps are real time — the spacing is not ' +
       'decorative.',
   task:'Go back to 1973 — the first one.',
   hint:'[data-year="1973"]',
   test:function(){ return S.year === 1973; },
   after:'1973. QAFCO 1, inaugurated by the Amir. Everything on that plan grew outward ' +
         'from it.'},

  /* the teaching moment. The lens is the strongest idea in the project and the one most
     likely to go unnoticed; the research says discovery comes from watching a person,
     not from a visible control. So a person shows it, to every delegation, out loud. */
  {room:'process', stage:1, lens:null,
   say:'Eight stages take Qatari gas to a field somewhere in 45 countries. Now — one ' +

];
var TDONE = false;

/* ══════════ chrome ══════════

/* ══════════ room: the site ══════════ */
function roomSite(){

/* The object panel. Every relationship in it is a place you can go — this is where the

/* ══════════ room: the record ══════════
   The timeline is spaced by real time, which is the best thing about it and also what
   made four of its thirteen markers untappable: 2011 and 2012 are twenty-two points
   apart on this axis, and a 64pt target swallows its neighbour whole. A real tap found
   it; a screenshot never would have.

   The fix keeps real spacing and steps the crowded dates DOWN a row, with a leader line
   back to the rail. Nothing moves horizontally, so the gaps still tell the story, and
   every one of the thirteen now has its own 64pt square. */
var AXW = 1306;   /* the axis's rendered width: 1366 canvas − 2 × 30pt body margin */
function roomRecord(){
  var y0 = 1969, y1 = 2027, span = y1 - y0;
  var m = MILES.filter(function(x){ return x[0] === S.year; })[0] || MILES[MILES.length-1];
  var pct = function(y){ return ((y - y0) / span * 100).toFixed(2); };
  var last = [-1e9, -1e9];
  var row = MILES.map(function(x){
    var px = (x[0] - y0) / span * AXW;
    var r = (px - last[0] >= 64) ? 0 : ((px - last[1] >= 64) ? 1 : 0);
    last[r] = px; return r;
  });
  var h = '<div class="body"><div class="rec">';
  h += '<div class="axis" data-en><div class="arail"></div>' +
    '<div class="afill" id="afill" style="width:calc(' + pct(S.year) + '% - 24px)"></div>' +
    MILES.map(function(x, i){
      return '<button class="yr r' + row[i] + (x[0] === S.year ? ' on' : '') +
        '" data-year="' + x[0] + '" style="left:calc(' + pct(x[0]) + '% )" aria-label="' +
        x[0] + '">' + (row[i] ? '<b class="lead"></b>' : '') +
        '<i></i><span>' + x[0] + '</span></button>';
    }).join('') +
    '<p class="rsub axn">Spacing follows real time — the gaps are the story. ' +
    'Dates too close to tap step down a row.</p>' +
    lensLine('record', 'inl') + '</div>';

  h += '<div class="rbody" id="rbody"><div class="card pad mcard" data-en>' +
    '<p class="lbl">' + m[0] + '</p>' +
    '<h2 class="h2 mh">' + m[1] + '</h2>' +
    (m[2].length ? '<div class="objr mt">' + m[2].map(function(s){
      return '<div><div class="sv">' + s[0] + (s[1] ? '<span class="su">' + s[1] +
        '</span>' : '') + '</div><div class="sl">' + s[2] + '</div></div>';
    }).join('') + '</div>' : '') +
    '<div class="ph grow"><span>' + m[0] + ' — archive photography</span></div></div>';

  h += '<div class="rcol" data-en><p class="lbl m0">And today</p>' +
    '<div class="rnow">' + FACTS.map(function(f){
      return '<div class="fct"><b>' + f[0] + '</b><div class="sl">' + f[1] + '</div></div>';
    }).join('') + '</div>' +
    '<div class="card pad rec2"><p class="lbl">Recognised by</p>' +
    '<div class="clist">' + CERTS.map(function(c){
      return '<div class="cl">' + c[0] + '<span> · ' + c[1] + '</span></div>';
    }).join('') +
    '<div class="cx"><div class="cl">HXM Modernization Award<span> · SAP Qatar, 2023</span>' +
    '</div><div class="cl">Responsible Care certification<span> · GPCA</span></div></div>' +
    '</div></div></div>';

  return h + '</div></div></div>';
}

/* ══════════ the desk ══════════ */
function roomDesk(){
  var h = '<div class="body"><div class="desk"><div class="dtabs" data-en>' +
    DTABS.map(function(t, i){
      return '<button class="dt' + (i === S.desk ? ' on' : '') + '" data-desk="' + i + '">' +
        t + '</button>';
    }).join('') + lensLine('desk', 'dsk') + '</div><div class="dbody" id="dbody" data-en>';
  if (S.desk === 0){
    h += '<div class="cols3">' + PEOPLE.map(function(c){
      return '<div class="col"><h3 class="h3 c3h">' + c[0] + '</h3><ul>' +
        c[1].map(function(l){ return '<li>' + l + '</li>'; }).join('') +
        '</ul><div class="ph grow"><span>Team photography</span></div></div>';
    }).join('') + '</div>';
  } else if (S.desk === 1){
    h += '<div class="dg1"><div class="card pad dcol">' +
      '<p class="lbl">Careers</p><h2 class="h2">Build the next fifty years</h2>' +
      '<p class="tx big">QAFCO careers span process engineering, laboratory science, marine ' +
      'operations, maintenance and commercial roles — on the site that supplies 14% of ' +
      'the world’s urea.</p>' +
      '<h3 class="h3 sub">Qatarization</h3>' +
      '<p class="tx">A skilled Qatari workforce, in line with Qatar National Vision 2030 — ' +
      'graduate and apprentice intakes each year, with development plans held at board level.</p>' +
      '<div class="qr foot">' + qrSVG() + '<div><div class="qt">Scan for open roles</div>' +

/* ══════════ the lens, applied ══════════
   Room markup is emitted neutral. The lens state is a second pass, which is what makes
   the sweep possible: each element can be changed at the moment the band reaches it. */
function lensTargets(){
  var r = $('#room'); if (!r) return [];
  return $$('[data-blk],[data-stage],[data-year],[data-region],[data-lensline]', r);
}
function applyOne(el){
  if (el.hasAttribute('data-lensline')){
    el.classList.toggle('on', !!S.lens);
    return;
  }
  var kind, val, v;
  if ((v = el.getAttribute('data-blk')) != null)          { kind = 'plants';  val = v; }
  else if ((v = el.getAttribute('data-stage')) != null)   { kind = 'stages';  val = +v; }
  else if ((v = el.getAttribute('data-year')) != null)    { kind = 'years';   val = +v; }
  else if ((v = el.getAttribute('data-region')) != null)  { kind = 'regions'; val = +v; }
  else return;
  var active = !!S.lens && LENSES[S.lens][kind].length > 0;
  var hit = active && LENSES[S.lens][kind].indexOf(val) > -1;
  el.classList.toggle('lens', hit);
  el.classList.toggle('dim',
    (active && !hit) || (kind === 'plants' && !!S.blk && S.blk !== val));
}
function applyLens(animated, reverse){
  var els = lensTargets();
  if (!animated || !MO.ok()) { els.forEach(applyOne); return; }
  MO.sweep($('#device'), els, applyOne, !!reverse);
}

/* ══════════ paint & routing ══════════ */
function paint(){
  var r = S.room, h;
  if (r === 'attract') h = roomAttract();
  else if (r === 'site') h = roomSite();
  else if (r === 'process') h = roomProcess();
  else if (r === 'reach') h = roomReach();
  else if (r === 'record') h = roomRecord();
  else h = roomDesk();
  $('#room').innerHTML = h;
  var chrome = r !== 'attract';
  $('#top').style.display = chrome ? 'flex' : 'none';
  $('#nav').style.display = (chrome && S.tour < 0) ? 'flex' : 'none';
  if (chrome) { $('#top').innerHTML = topStrip(); $('#nav').innerHTML = navBar(); }
  syncBack();
}
function afterPaint(roomChanged){
  if (S.room === 'site'){
    MO.camBind($('#pcam'));
    if (S.blk){
      var w = blockWorld(S.blk);
      if (roomChanged){ MO.camHome(0); MO.camTo(w.x, w.y, 1.3, 440, 470, MO.D.xl); }
      else MO.camTo(w.x, w.y, 1.3, 440, 470, 0);
    } else MO.camHome(0);
    if (roomChanged && !MO.rm && MO.g)
      MO.g.fromTo('#ppipe', {strokeDashoffset:420}, {strokeDashoffset:0, duration:2.4,
        ease:'power2.out'});
  }
  if (S.room === 'attract') attractStart(); else attractStop();
}

function go(room, isBack){
  if (S.room === room && room !== 'attract'){ render(false); return; }
  if (!isBack && S.room && S.room !== room && room !== 'attract'){
    HIST.push({room:S.room, blk:S.blk, stage:S.stage, region:S.region,
               year:S.year, desk:S.desk});
    if (HIST.length > 40) HIST.shift();
  }
  if (room === 'attract' || room === 'site') HIST.length = 0;
  closeIx();
  if (room !== 'site') S.blk = null;
  if (room === 'attract') { attractStop(); }
  S.room = room;
  render(true, isBack ? 'back' : 'fwd');
}
function render(roomChanged, dir){
  var el = $('#room');
  if (!roomChanged || !MO.ok()){
    paint(); applyLens(false); afterPaint(!!roomChanged);
    if (roomChanged) MO.nameRoll($('#rname'));
    tourSync(); tourCheck(); return;
  }
  MO.roomChange(el, function(){
    paint(); applyLens(false); afterPaint(true); MO.nameRoll($('#rname'));
    tourSync(); tourCheck();
  }, dir);
}
function back(){
  var p = HIST.pop();
  if (!p) { go('site', true); return; }
  S.room = p.room; S.blk = p.blk; S.stage = p.stage; S.region = p.region;
  S.year = p.year; S.desk = p.desk;
  render(true, 'back');
}
function syncBack(){
  var b = $('.nbk'); if (!b) return;
  b.classList.toggle('hide', HIST.length === 0);
}
/* the position line is the only part of the top strip that changes inside a room */
function syncPos(){
  var el = $('#rpos'); if (!el) return;
  el.innerHTML = position();
  if (!MO.rm && MO.g) MO.g.from(el, {opacity:0, y:-7, duration:MO.D.s, ease:MO.E.out,
                                     clearProps:'transform,opacity'});
}

/* opening a plant pans the plan out from under the panel that just covered the right
   third of the screen — the move answers "where did it go" before it is asked */
function setBlock(id){
  S.blk = (S.blk === id) ? null : id;
  var obj = $('#obj'), hero = $('.hero');
  obj.innerHTML = S.blk ? objPanel(PLANTS[S.blk]) : '';
  obj.classList.toggle('on', !!S.blk);
  if (hero) hero.classList.toggle('out', !!S.blk);
  applyLens(false); syncPos();
  if (S.blk){
    var w = blockWorld(S.blk);
    MO.camTo(w.x, w.y, 1.3, 440, 470, MO.D.xl);
    if (!MO.rm && MO.g) MO.g.from(obj.children, {opacity:0, x:26, duration:MO.D.l,
      ease:MO.E.out, stagger:.07, clearProps:'transform,opacity'});
  } else MO.camHome(MO.D.xl);
}

function setLens(k){
  var was = S.lens;
  S.lens = (was === k) ? null : (k || null);
  closeSheet();
  /* the sheet takes 280ms to clear; start the sweep as it goes rather than after it,
     so the whole gesture reads as one move instead of two */
  var run = function(){
    /* afterPaint re-binds the camera. paint() replaces the whole room, so the node
       MO.camBind was holding is now detached — skip this and the plan silently stops
       responding to every camera move after the first lens change. */
    paint(); afterPaint(false); applyLens(true, !S.lens && !!was);
    tourSync(); tourCheck(); resetIdle();
  };
  if (MO.rm) run(); else setTimeout(run, 180);
}

/* ══════════ the tour engine ══════════ */
function tourGo(i){
  if (i < 0) return;
  if (i >= TOUR.length) { tourEnd(); return; }
  var t = TOUR[i], changed = S.room !== t.room;
  S.tour = i; TDONE = false; ACT = {};
  clearTimeout(hintT); if (hintTw) { hintTw.kill(); hintTw = null; }
  S.room = t.room;
  if ('lens' in t) S.lens = t.lens || null;
  S.blk = ('blk' in t) ? t.blk : null;
  if ('stage' in t)  S.stage  = t.stage;
  if ('region' in t) S.region = t.region;
  if ('year' in t)   S.year   = t.year;
  HIST.length = 0;
  $('#device').classList.add('tourmode');
  render(true, 'fwd');
  hintT = setTimeout(showHint, 12000);
  resetIdle();
}
function tourBar(){

      'stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path id="tickp" d="M5 12.5l4.5 4.5L19 7"/></svg></span>' +
    '</div>' +
    '<div class="tdots">' + TOUR.map(function(_, n){

function tourSync(){

     clearProps:'transform,opacity'});

/* run after every state change; the moment the guest has done it, say so */
function tourCheck(){
  if (S.tour < 0 || TDONE) return;
  var t = TOUR[S.tour];
  if (!t.test()) return;
  TDONE = true;
  clearTimeout(hintT); if (hintTw) { hintTw.kill(); hintTw = null; }
  var row = $('#trow'), next = $('#tnext'), say = $('#tsay');
  if (!row) return;
  row.classList.add('ok');

    say.textContent = t.after;

                                        clearProps:'transform,opacity'});

/* nobody gets stuck: after twelve seconds the app shows the target rather than waiting */
var hintT = null, hintTw = null;
function showHint(){

/* ══════════ idle ══════════
   The kiosk research recommends a 20–30s attract revert; that number is for an attract
   loop, not for a person mid-paragraph. So the attract loop is 20 seconds and the idle
   revert is 60 + 12 — long enough to read a stage card, short enough that the next
   visitor meets the night scene and not somebody else's leftovers. During a hosted
   tour it is 240, because the host is standing right there. */
var idleT = null, cdT = null, cd = 12;
function resetIdle(){
  clearTimeout(idleT); clearInterval(cdT);
  $('#idle').classList.remove('on');
  if (S.room === 'attract') return;
  idleT = setTimeout(showIdle, S.tour >= 0 ? 240000 : 60000);
}
function showIdle(){
  cd = 12; $('#idle').classList.add('on'); $('#idn').textContent = cd;
  if (!MO.rm && MO.g) MO.g.fromTo('#idring', {strokeDashoffset:0},
    {strokeDashoffset:326, duration:12, ease:'none'});
  cdT = setInterval(function(){
    cd--; $('#idn').textContent = Math.max(0, cd);
    if (cd <= 0){ clearInterval(cdT); hardReset(); }
  }, 1000);
}
function hardReset(){
  S.lens = null; S.blk = null; S.stage = 1; S.region = 0; S.year = 2027; S.desk = 0;
  S.tour = -1; TDONE = false;
  $('#tour').classList.remove('on');
  $('#device').classList.remove('tourmode');

  go('attract');

/* ══════════ fit ══════════ */
var pending = false, dev;
function scale(){
  var W = window.innerWidth || 0, H = window.innerHeight || 0;
  if (!W || !H) return;
  var coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
  var pad = coarse ? 0 : (W < 900 ? 14 : 54);
  var s = Math.min((W - pad * 2) / 1366, (H - pad * 2) / 1024, 1);
  s = Math.max(s, 0.1);
  document.documentElement.style.setProperty('--s', s.toFixed(4));
  dev.style.left = Math.round((W - 1366 * s) / 2) + 'px';
  dev.style.top  = Math.round((H - 1024 * s) / 2) + 'px';
}
function queueScale(){
  if (pending) return; pending = true;
  requestAnimationFrame(function(){ pending = false; scale(); });
}

/* ══════════ input ══════════ */
function wire(){
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-room],[data-blk],[data-stage],[data-region],[data-year],' +
      '[data-desk],[data-lens],[data-back],[data-index],[data-tour],[data-tourgo],' +
      '[data-tourend],[data-goyear],[data-gostage],[data-golens],[data-desk-go],' +
      '[data-lensopen],[data-lensclose]');
    if (!t) return;
    var a = function(n){ return t.getAttribute(n); };

    if (t.hasAttribute('data-lensopen'))  { openSheet(); return; }
    if (t.hasAttribute('data-lensclose')) { closeSheet(); return; }
    if (t.hasAttribute('data-back'))      { back(); return; }
    if (t.hasAttribute('data-index'))     {
      a('data-index') === 'close' ? closeIx() :
        ($('#ix').classList.contains('on') ? closeIx() : openIx()); return; }
    if (t.hasAttribute('data-tour'))      { tourGo(0); return; }
    if (t.hasAttribute('data-tourgo'))    { tourGo(+a('data-tourgo')); return; }
    if (t.hasAttribute('data-tourend'))   { tourEnd(); return; }
    if (t.hasAttribute('data-lens'))      { ACT.lens = a('data-lens');
                                            setLens(a('data-lens')); return; }
    if (t.hasAttribute('data-golens'))    {
      ACT.lens = a('data-golens'); S.lens = a('data-golens');
      var rm2 = a('data-lensroom');
      if (rm2 && rm2 !== S.room) go(rm2);
      else { paint(); afterPaint(false); applyLens(true);
             tourSync(); tourCheck(); resetIdle(); }
      return; }
    if (t.hasAttribute('data-goyear'))    { ACT.year = +a('data-goyear');
                                            S.year = ACT.year; go('record'); return; }
    if (t.hasAttribute('data-gostage'))   { ACT.stage = +a('data-gostage');
                                            S.stage = ACT.stage; go('process'); return; }
    if (t.hasAttribute('data-desk-go'))   { ACT.desk = +a('data-desk-go');
                                            S.desk = ACT.desk; go('desk'); return; }
    if (t.hasAttribute('data-room'))      { go(a('data-room')); return; }

    if (t.hasAttribute('data-blk')){
      ACT.blk = a('data-blk'); setBlock(a('data-blk'));
      tourCheck(); resetIdle(); return; }
    if (t.hasAttribute('data-stage')){
      var d = +a('data-stage') - S.stage; ACT.stage = +a('data-stage');
      S.stage = ACT.stage; swapIn('#pdet', d, roomProcess); return; }
    if (t.hasAttribute('data-region')){
      var dr = +a('data-region') - S.region; ACT.region = +a('data-region');
      S.region = ACT.region; swapIn('#rcap', dr, roomReach); return; }
    if (t.hasAttribute('data-year')){
      var dy = +a('data-year') - S.year; ACT.year = +a('data-year');
      S.year = ACT.year; swapIn('#rbody', dy, roomRecord); return; }
    if (t.hasAttribute('data-desk')){
      var dd = +a('data-desk') - S.desk; ACT.desk = +a('data-desk');
      S.desk = ACT.desk; swapIn('#dbody', dd, roomDesk); return; }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ closeSheet(); closeIx(); return; }
    if (e.key === 'Enter' || e.key === ' '){
      var t = document.activeElement;
      if (t && t.hasAttribute && t.hasAttribute('data-blk')){
        e.preventDefault(); t.dispatchEvent(new MouseEvent('click', {bubbles:true}));
      }
    }
  });
  ['pointerdown','keydown'].forEach(function(ev){
    document.addEventListener(ev, function(){ if (S.room !== 'attract') resetIdle(); });
  });
  window.addEventListener('resize', queueScale);
  window.addEventListener('orientationchange', queueScale);
  if (window.ResizeObserver) new ResizeObserver(queueScale).observe(document.documentElement);
  $('#lsheet').addEventListener('click', function(e){
    if (e.target === $('#lsheet')) closeSheet(); });
  $('#idkeep').addEventListener('click', function(){ resetIdle(); });
  $('#idreset').addEventListener('click', hardReset);
}

/* Changing the stage / year / region / tab repaints the room but animates only the part
   that changed, sliding in from the side you moved. Direction is the information. */
function swapIn(sel, d){
  paint(); afterPaint(false); applyLens(false); syncPos();
  MO.detail($(sel), d);
  tourSync(); tourCheck(); resetIdle();
}

dev = $('#device');
buildIndex(); wire(); scale();
S.room = 'attract'; paint(); afterPaint(true);
window.__S = S;                       /* the harness reads this; the app never does */
window.__T = function(){ return {i:S.tour, done:TDONE}; };
})();

</script>

  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
